
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東西命理科學顧問 - AI 2026 趨勢分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Playfair+Display:ital,wght@0,900;1,900&family=Libre+Baskerville:ital@1&family=Montserrat:wght@800&display=swap');
        
        .font-serif-heavy { font-family: 'Noto Serif TC', serif; }
        .font-magazine { font-family: 'Playfair Display', serif; }
        .font-quote { font-family: 'Libre Baskerville', serif; }
        .font-sans-bold { font-family: 'Montserrat', sans-serif; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
        
        .magazine-dropcap::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            float: left;
            margin-right: 0.8rem;
            line-height: 0.8;
            color: #0f172a;
            font-style: italic;
        }

        /* 物理 A4 頁面佈局 */
        .pdf-container {
            background: #f1f5f9;
            padding: 60px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .pdf-page {
            width: 210mm;
            /* 修正：設為 296.3mm 配合 html2pdf 的精確度需求，徹底消除首尾空白 */
            height: 296.3mm; 
            padding: 20mm 15mm;
            margin-bottom: 40px; 
            background: white;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        /* 導出模式下的強制修正 */
        .html2pdf__container .pdf-container {
            padding: 0 !important;
            margin: 0 !important;
            background: white !important;
            display: block !important;
        }

        .html2pdf__container .pdf-page {
            box-shadow: none !important;
            margin: 0 !important;
            border: none !important;
            width: 210mm !important;
            height: 296.3mm !important;
            page-break-after: always !important;
            page-break-inside: avoid !important;
            /* 解決 html2canvas 文字渲染偏移 */
            overflow-wrap: break-word !important;
            word-break: break-all !important;
        }

        /* 最後一頁強制不分頁，防止產生空白尾頁 */
        .html2pdf__container .pdf-page:last-child {
            page-break-after: avoid !important;
        }

        /* 確保色塊內的文字正確換行且不溢出 */
        .pdf-text-container {
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.6;
        }

        .report-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .content-wrap {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; margin: 0; padding: 0; }
            .pdf-container { padding: 0; background: white; width: 100%; display: block; }
            .pdf-page { box-shadow: none; margin: 0; page-break-after: always; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "lunar-javascript": "https://esm.sh/lunar-javascript@^1.7.7",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#020202] text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
