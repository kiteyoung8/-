        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(30px) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); opacity: 0; }
        }
        .orbit-particle { 
            position: absolute;
            width: 6px;
            height: 6px;
            background: #6366f1;
            border-radius: 50%;
            filter: blur(1px);
            animation: orbit 3s linear infinite; 
        }
